name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      cfb_tag:
        description: chis-burner-cmd release tag (for example v0.1.0)
        required: false
        default: latest

env:
  CFB_GITHUB_REPO: eyenobig/chis-burner-cmd
  CFB_RELEASE_TAG: ${{ inputs.cfb_tag || vars.CFB_RELEASE_TAG || 'v0.3.5' }}
  VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}

jobs:
  # 门禁：tag 触发时，校验 tag 指向的提交在固定分支 master 上，否则拦下整条流水线
  # （省掉 4 平台的无效构建）。workflow_dispatch 手动触发没有 tag，直接放行。
  # 与 chis-burner-cmd 的 build.yml 门禁保持一致。
  gate:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: master   # 固定发版分支，想改成别的在这里改
    steps:
      - uses: actions/checkout@v4
      - name: Require tag on ${{ env.RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_BRANCH"
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "OK: tag '$GITHUB_REF_NAME' (commit $GITHUB_SHA) is on '$RELEASE_BRANCH'."
          else
            echo "::error::Tag '$GITHUB_REF_NAME' 不在 '$RELEASE_BRANCH' 分支上，已拒绝构建。请把 master 快进到该提交，或在 master 上重新打 tag。"
            exit 1
          fi

  publish-tauri:
    # gate 在 tag 推送时校验分支；workflow_dispatch 手动触发时 gate 被 skip，
    # 这里用 success() || skipped() 让手动触发也能跑到 publish。
    needs: gate
    if: ${{ success() || needs.gate.result == 'skipped' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # 暂时只打 Windows x64；恢复多平台时把 macOS/Linux 行加回 matrix。
      matrix:
        include:
          - platform: windows-latest
            args: ''
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev pkg-config

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify updater signing secret
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY) throw new Error('Missing TAURI_SIGNING_PRIVATE_KEY repository secret')"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # 空密码密钥：必须把 PASSWORD 写成存在的空环境变量，否则 tauri 会交互式要密码并在 CI 失败。
      - name: Normalize signing password env
        shell: bash
        run: |
          # secrets 未配置时也写成空串，保证变量存在
          printf 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD=%s\n' "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD-}" >> "$GITHUB_ENV"
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Unlock signing key (smoke)
        shell: bash
        run: |
          set -euo pipefail
          echo 'chis-sign-test' > sign-smoke.txt
          if ! npx tauri signer sign sign-smoke.txt; then
            echo '::error::无法用当前 Secret 解锁 updater 私钥。请把本地 .tauri/chis-flasher.key 全文重新贴进 TAURI_SIGNING_PRIVATE_KEY；空密码密钥请把 TAURI_SIGNING_PRIVATE_KEY_PASSWORD 设为空（或删掉该 Secret）。'
            exit 1
          fi
          rm -f sign-smoke.txt sign-smoke.txt.sig
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Download released cfb sidecar
        run: npm run build:cfb:github
        env:
          CFB_TARGET: ${{ matrix.rust_target }}
          CFB_GITHUB_TOKEN: ${{ secrets.CFB_RELEASE_TOKEN || github.token }}

      - name: Smoke-test CFB sidecar
        run: npm run check:platform
        env:
          CFB_TARGET: ${{ matrix.rust_target }}

      - name: Build and publish Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Chis Flasher ${{ github.ref_name }}
          releaseBody: Windows x64 installer (NSIS). Draft until verified.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
